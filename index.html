<style>
:root{--navy:#17243b;--blue:#275caa;--line:#d8dee9;--muted:#64748b;--bg:#f4f6f9;--ok:#087a55;--warn:#ad5a00;--bad:#b42318;
  --c-inner:#7c3aed;--c-laser:#dc2626;--c-part:#2563eb;--c-oem:#0d9488}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;font-size:13px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.topbar{background:var(--navy);color:#fff;padding:9px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px #0f172a33}
.title{display:flex;align-items:center;gap:10px}.ci-logo{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px #ffffff22}
.title h1{font-size:20px;margin:0;letter-spacing:-.4px}
.ver-tag{font-size:11px;font-weight:700;color:#cbd5e1;border:1px solid #475569;border-radius:999px;padding:1px 8px}
.topbar .spacer{flex:1}
main{padding:12px 20px 40px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:8px 16px;font-weight:800;color:#334155;font-size:14px}
.tabs button small{margin-left:6px;font-weight:600;color:#94a3b8;font-size:11.5px}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}.tabs button.on small{color:#cbd5e1}
.tabs .cat-inner.on{background:var(--c-inner);border-color:var(--c-inner)}.tabs .cat-laser.on{background:var(--c-laser);border-color:var(--c-laser)}.tabs .cat-part.on{background:var(--c-part);border-color:var(--c-part)}.tabs .cat-oem.on{background:var(--c-oem);border-color:var(--c-oem)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e0e5ed;border-radius:10px;padding:8px 10px;margin-bottom:8px;position:sticky;top:50px;z-index:30}
.bar .spacer{flex:1}
.views{display:flex;gap:4px}.views button{border:1px solid transparent;background:#f1f5f9;border-radius:8px;padding:7px 12px;font-weight:700;color:#475569}
.views button.on{background:#2f6ac6;color:#fff}
.datebox{display:flex;gap:3px;align-items:center}.datebox button,.datebox input{height:32px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:0 8px}
.search{height:32px;border:1px solid #cbd5e1;border-radius:7px;padding:0 10px;width:240px;max-width:100%}
#scope{height:32px;border:1px solid #cbd5e1;border-radius:7px;padding:0 6px}
.tbl-wrap{background:#fff;border:1px solid #e0e5ed;border-radius:10px;overflow:auto;max-height:calc(100vh - 175px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.grid th{position:sticky;top:0;z-index:5;background:#59636f;color:#fff;font-weight:700;padding:6px 7px;white-space:nowrap;text-align:left;border-right:1px solid #6b7684}
.grid th small{display:block;font-weight:500;font-size:10.5px;color:#d1d5db}
.grid th.in{background:#2f5f9e}.grid th.st{background:#3f4a57}
.grid td{padding:3px 7px;border-bottom:1px solid #eef1f5;border-right:1px solid #f1f4f8;white-space:nowrap;vertical-align:middle}
.grid tr.first td{border-top:2px solid #cfd6e0}
.grid td.num,.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td.in{background:#f5f9ff;padding:1px 3px}
.grid td.st{font-weight:800;color:#0f172a;background:#fafbfc}
.grid tr.out td{background:#fffaf0}.grid tr.out td.in{background:#fff3dc}
.grid td.c-proc{font-weight:700;color:#334155}.grid .c-s,.grid .c-memo,.grid .c-n{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.grid .c-cust{max-width:130px;overflow:hidden;text-overflow:ellipsis}
.grid td.link{color:#1d4ed8;cursor:pointer;text-decoration:underline dotted}
.grid td.neg,.neg{color:var(--bad)!important}.ok{color:var(--ok)}
.grid td.empty{padding:40px;text-align:center;color:var(--muted);white-space:normal}
.qi{width:78px;height:26px;border:1px solid #c7d2e0;border-radius:5px;text-align:right;padding:0 6px;background:#fff}
.qi:focus{outline:2px solid #2f6ac6;border-color:#2f6ac6}.qi.bad{color:var(--bad)}.qi.pend{background:#fff7d6}.qi.err{background:#fee2e2}
.cb{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;background:#64748b}
.cb.cat-inner{background:var(--c-inner)}.cb.cat-laser{background:var(--c-laser)}.cb.cat-part{background:var(--c-part)}.cb.cat-oem{background:var(--c-oem)}
.warn-dot{display:inline-block;margin-left:4px;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:#f59e0b;color:#fff;font-weight:900;font-size:11px;cursor:help}
.lk{font-size:11px}
.muted{color:var(--muted)}.small{font-size:11.5px}
.more{text-align:center;padding:10px}.more button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 16px;font-weight:700}
.status{position:fixed;left:16px;bottom:12px;font-size:12px;color:var(--muted)}
.mbar{display:flex;gap:6px;align-items:center;margin:0 0 8px;flex-wrap:wrap}.mbar button{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:4px 10px;font-weight:700;color:#475569}.mbar button.on{background:#2f6ac6;border-color:#2f6ac6;color:#fff}
.grid.month td,.grid.month th{padding:3px 5px;font-size:12px}.grid.month th.day{cursor:pointer}.grid.month th.sun{color:#fecaca}.grid.month th.sat{color:#bfdbfe}
.grid th.today{background:#2f6ac6}.grid td.today{background:#eef4ff}.grid td.tot{font-weight:800;background:#fafbfc}
.ord{display:grid;gap:10px;max-width:1500px}
.card{background:#fff;border:1px solid #e0e5ed;border-radius:10px;padding:14px 16px}.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}.card.inner{margin-top:10px;background:#fbfcfe}
.fg{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:#475569}.fg label.w2{grid-column:span 2}
.fg input,.fg select{height:32px;border:1px solid #cbd5e1;border-radius:7px;padding:0 8px;font-weight:400;color:#1f2937}
.lbl{margin:12px 0 6px;font-weight:800;font-size:12.5px;color:#334155}.lbl small{font-weight:500}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:999px;padding:3px 4px 3px 10px;font-weight:700;font-size:12px}
.chip button{border:0;background:transparent;color:#94a3b8;font-size:14px;line-height:1;padding:0 4px}.chip button:hover{color:var(--bad)}
.addp{height:28px;border:1px dashed #94a3b8;border-radius:999px;padding:0 8px;background:#fff;color:#475569}
.act{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}.act.end{border-top:1px solid #eef1f5;padding-top:12px}.act .spacer{flex:1}
.act button,.card button{border:1px solid #b9c5d6;background:#fff;color:#26354d;border-radius:7px;padding:7px 13px;font-weight:700}
button.primary{background:#2f6ac6!important;color:#fff!important;border-color:#2f6ac6!important}button.danger{background:#fff!important;color:var(--bad)!important;border-color:#f3b4ad!important}
button.small{padding:3px 9px!important;font-size:11.5px}button:disabled{opacity:.5;cursor:default}
.msg{font-size:12.5px;font-weight:700;color:var(--ok)}
textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:12px}
.grid.small{font-size:12px}.grid.small th{position:static}
.tplrow{display:flex;gap:10px;align-items:center;margin-bottom:8px}.tplrow b{width:70px}
.improw{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.improw select{height:30px;border:1px solid #cbd5e1;border-radius:6px}
.kv{font-size:12.5px;margin:6px 0;line-height:1.6}
.note{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0;line-height:1.6}.note.warn{background:#fff7e6;border-color:#f6d28b;color:#7a4500}

    part:  ['블랭킹', '탭핑', '조립/포장', OUT],

  };

  function normProc(n) {

  }
  function isOut(n) { return normProc(n) === OUT; }
  var BUY = '매입';
  function isBuy(n) { return normProc(n) === BUY; }

  /* 숫자 읽기 : «18,652» «-» «250+250» «1.5» 모두 */
  function num(v) {

    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v).replace(/[\uFF10-\uFF19\uFF0E\uFF0B\uFF0D]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/,/g, '').trim();   // 전각 숫자(２) 도 숫자로
    if (!s || s === '-' || /%$/.test(s)) return 0;
    if (/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(s)) return Number(s);
    if (/^=?[\d+\-*/(). ]+$/.test(s)) { try { var r = Function('"use strict";return (' + s.replace(/^=/, '') + ')')(); return isFinite(r) ? r : 0; } catch (e) { return 0; } }
    return 0;
  }
  /* 날짜 : «2026-11-1 (일)» «2026/11/01» «2026-11-01» «20261101» → «2026-11-01» */
  function ymd(v) {
    if (v == null) return '';
    if (v instanceof Date) return v.getFullYear() + '-' + p2(v.getMonth() + 1) + '-' + p2(v.getDate());
    if (typeof v === 'number' && v > 20000 && v < 80000) { var t0 = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return t0.getUTCFullYear() + '-' + p2(t0.getUTCMonth() + 1) + '-' + p2(t0.getUTCDate()); }   // 엑셀 날짜 숫자
    var s = String(v).trim(), m;
    if ((m = /^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(s))) return m[1] + '-' + p2(m[2]) + '-' + p2(m[3]);

    return '';
  }
  function p2(n) { n = Number(n); return (n < 10 ? '0' : '') + n; }
  function addDays(d, n) { var t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); return ymd(t); }
  function today() { return ymd(new Date()); }
  function monthStart(d) { return d.slice(0, 8) + '01'; }
  function monthEnd(d) { var t = new Date(d.slice(0, 7) + '-01T00:00:00'); t.setMonth(t.getMonth() + 1); t.setDate(0); return ymd(t); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function hash(s) { var h1 = 0x811c9dc5, h2 = 0x1234567; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); } return ((h1 >>> 0).toString(36) + (h2 >>> 0).toString(36)); }

  /* ───────── 자료 모음 (recs: key → {v,r,by,at}) ───────── */
  function Store() { this.recs = new Map(); this.items = new Map(); this.ent = new Map(); this.adj = new Map(); this.cfg = null; this.ix = null; this.dirtyIx = true;
    this.erp = { ship: new Map(), order: new Map(), up: new Map(), rev: 0, epoch: '' }; this.erpCfg = null; this.dead = new Set(); this.virt = new Set();
    this.erpOut = new Map(); this.erpOrd = new Map(); this.erpShip = new Map(); this.erpOq = new Map(); this.erpInfo = null; this.erpDirty = true; this.buy = []; this.erpBuy = new Map(); this.erpBuyL = new Map(); this.buyInfo = null; this.erpNeg = new Map(); }
  Store.prototype.set = function (k, v, meta) {
    var old = this.recs.get(k);
    var rec = { v: v, r: meta && meta.r != null ? meta.r : (old ? old.r : 0), by: meta && meta.by || '', at: meta && meta.at || '' };
    this.recs.set(k, rec);
    var t = k.charAt(0);
    if (t === 'i') { var id = k.slice(2); this.virt.delete(id); if (v && !v.del) { v.id = id; if (!v.catSet && (v.cat === 'part' || v.cat === 'frame')) v.cat = (isFrameName(v.n) || isFrameName(v.it)) ? 'frame' : 'part'; this.items.set(id, v); this.dead.delete(id); } else { this.items.delete(id); if (v && v.soft) this.dead.delete(id); else this.dead.add(id); } this.erpDirty = true; }
    else if (t === 'e') { if (v && (v.g || v.b)) this.ent.set(k.slice(2), v); else this.ent.delete(k.slice(2)); }
    else if (t === 'a') { if (v && num(v.a)) this.adj.set(k.slice(2), v); else this.adj.delete(k.slice(2)); }   /* 기초재고 조정 a:품목|공정|날짜 {a: 더할 수량} */
    else if (k === 'c:procs') this.cfg = v;
    else if (k === 'c:erp') { this.erpCfg = v; this.erpDirty = true; }
    this.dirtyIx = true;
  };
  Store.prototype.clear = function () { this.recs.clear(); this.items.clear(); this.ent.clear(); this.adj.clear(); this.cfg = null; this.erpCfg = null; this.dead.clear(); this.virt.clear(); this.dirtyIx = true; this.erpDirty = true; };
  Store.prototype.procList = function () {
    var set = {}, out = [];
    function add(n) { n = normProc(n); if (n && !set[n]) { set[n] = 1; out.push(n); } }
    var cfg = this.cfg || {};
    (cfg.list || []).forEach(add);
    CATS.forEach(function (c) { ((cfg.tpl && cfg.tpl[c.id]) || DEFAULT_TPL[c.id]).forEach(add); });
    this.items.forEach(function (it) { (it.procs || []).forEach(function (p) { add(p.n); }); });
    return out;
  };
  Store.prototype.tpl = function (cat) { var c = this.cfg; return ((c && c.tpl && c.tpl[cat]) || DEFAULT_TPL[cat] || [OUT]).slice(); };

  /* 색인 : 공정별 날짜 정렬 + 누적합 → 기간 합계를 빠르게 */
  Store.prototype.index = function () {
    this.deriveErp();
    if (!this.dirtyIx && this.ix) return this.ix;
    var by = new Map(), self = this;
    this.ent.forEach(function (v, k) {
      var a = k.lastIndexOf('|'), pk = k.slice(0, a), d = k.slice(a + 1);
      var L = by.get(pk); if (!L) { L = []; by.set(pk, L); }
      L.push([d, num(v.g), num(v.b), 0]);
    });
    this.adj.forEach(function (v, k) {
      var a = k.lastIndexOf('|'), pk = k.slice(0, a), d = k.slice(a + 1);
      var L = by.get(pk); if (!L) { L = []; by.set(pk, L); }
      L.push([d, 0, 0, num(v.a)]);
    });
    /* ERP 출고 : 그날 직접 넣은 출고가 없을 때만 */
    this.erpOut.forEach(function (m, id) {
      var it = self.items.get(id), pr = it && outProc(it); if (!pr) return;
      var pk = id + '|' + pr.id;
      m.forEach(function (q, d) { if (self.ent.has(pk + '|' + d)) return; var L = by.get(pk); if (!L) { L = []; by.set(pk, L); } L.push([d, q, 0, 0]); });
    });
    /* 매입분석도구 매입 : 유통/OEM 매입 공정, 그날 직접 넣은 매입이 없을 때만 */
    this.erpBuy.forEach(function (m, id) {
      var it = self.items.get(id), pr = it && buyProc(it); if (!pr) return;
      var pk = id + '|' + pr.id;
      m.forEach(function (q, d) { if (self.ent.has(pk + '|' + d)) return; var L = by.get(pk); if (!L) { L = []; by.set(pk, L); } L.push([d, q, 0, 0]); });
    });

    by.forEach(function (L, pk) {
      L.sort(function (x, y) { return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0; });
      var ds = new Array(L.length), G = new Array(L.length + 1), P = new Array(L.length + 1), B = new Array(L.length + 1), A = new Array(L.length + 1);
      G[0] = 0; P[0] = 0; B[0] = 0; A[0] = 0;
      for (var i = 0; i < L.length; i++) { ds[i] = L[i][0]; G[i + 1] = G[i] + L[i][1]; B[i + 1] = B[i] + L[i][2]; P[i + 1] = P[i] + L[i][1] + L[i][2]; A[i + 1] = A[i] + L[i][3]; }

    });

  };

  /* (a, b] 기간 합계 {g 양품, b 불량, p 생산} */
  Store.prototype.sum = function (itemId, pid, a, b) {
    var x = this.index().get(itemId + '|' + pid);

    var i = upto(x.ds, a), j = upto(x.ds, b);
    return { g: x.G[j] - x.G[i], b: x.B[j] - x.B[i], p: x.P[j] - x.P[i], a: x.A[j] - x.A[i] };
  };
  /* 그날 값 (출고 공정은 직접 입력이 없으면 ERP 출고 {g, erp:true}) */
  Store.prototype.day = function (itemId, pid, d) {
    var e = this.ent.get(itemId + '|' + pid + '|' + d); if (e) return e;
    this.deriveErp();
    var it = this.items.get(itemId);
    var bm = this.erpBuy.get(itemId), bp = it && buyProc(it);
    if (bp && bp.id === pid) return bm && bm.has(d) ? { g: bm.get(d), erp: true, buy: true } : null;
    var m = this.erpOut.get(itemId); if (!m || !m.has(d)) return null;

    var s0 = this.sum(it.id, pr.id, d0, d), s = num(pr.o0) + s0.g + s0.a;

/* ───────── v70 : 실사 오차 통계 (데이터 재고 vs 실사재고) + 틀린 제품 목록 ─────────
   오차율 = |실사 − 데이터| ÷ |실사| (실사 0 이면 |데이터| 기준 → 100%) */
var AS_BK = [['0', '일치', 0, 0], ['5', '5% 이하', 0, 5], ['10', '5~10%', 5, 10], ['30', '10~30%', 10, 30], ['99', '30% 넘음', 30, 1e9]];
function asRows(m) {
  var out = [];

    var it = store.items.get(a[0]); if (!it) return; var pi = it.procs.findIndex(function (p) { return p.id === a[1]; }); if (pi < 0) return;
    var v = rec.v, q = SU.num(v.q), d = SU.num(v.data0), df = Math.round((q - d) * 1000) / 1000, base = Math.abs(q) || Math.abs(d), rate = df ? (base ? Math.abs(df) / base * 100 : 100) : 0;

}
function pct1(v) { return (Math.round(v * 10) / 10).toFixed(1) + '%'; }

  h += '<div class="card"><h3>월별 추이 <small class="muted">최근 6달</small></h3><table class="grid small"><thead><tr><th>월</th><th class="num">실사</th><th class="num">틀림</th><th class="num">일치율</th><th class="num">차이 합</th><th class="num">오차율</th></tr></thead><tbody>' +
    tm.map(function (z) { var x = z[1], d = x.q - x.data; return '<tr' + (z[0] === m ? ' class="on"' : '') + '><td>' + z[0].replace('-', '.') + '</td><td class="num">' + (x.n || '-') + '</td><td class="num">' + (x.n ? x.bad : '-') + '</td><td class="num">' + (x.n ? pct1(x.acc) : '-') + '</td><td class="num">' + (x.n ? (d > 0 ? '+' : '') + fmt(d, false) : '-') + '</td><td class="num">' + (x.n ? pct1(x.erate) : '-') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  /* 틀린 제품 목록 */
  var q = (ST.q || '').toLowerCase();
  var bad = all.filter(function (r) { return r.diff && (!ST.bk || r.bk === ST.bk) && (!q || (itemText(r.it) + ' ' + prodCode(r.it).toLowerCase() + ' ' + r.pr.n).indexOf(q) >= 0); });
  if (ST.bk === '0') bad = all.filter(function (r) { return !r.diff; });

    shown.map(function (r) { var it = r.it; return '<tr data-ai="' + it.id + '" data-ap="' + r.pi + '"><td><span class="cb cat-' + it.cat + '">' + esc(SU.CAT_NAME[it.cat] || '') + '</span></td><td class="c-p link" data-open="' + it.id + '">' + esc(it.p) + '</td><td class="c-pc">' + prodCell(it) + '</td><td class="c-n">' + esc(it.it || it.n || '') + '</td><td class="c-s">' + esc(it.s || '') + '</td><td class="c-cust">' + esc(it.cust || '') + '</td><td class="c-proc">' + esc(r.pr.n) + '</td><td class="num">' + fmt(r.data, false) + '</td><td class="num">' + fmt(r.q, false) + '</td><td class="num"><b class="' + (r.diff < 0 ? 'neg' : r.diff > 0 ? 'pos' : '') + '">' + (r.diff > 0 ? '+' : '') + fmt(r.diff, false) + '</b></td><td class="num">' + fmt(Math.abs(r.diff), false) + '</td><td class="num"><span class="as-rt bk-' + r.bk + '">' + pct1(r.rate) + '</span></td><td>' + esc(r.by) + '</td><td><button type="button" class="au-tr">🔍</button></td></tr>'; }).join('') +
    (shown.length ? '' : '<tr><td colspan="14" class="empty">' + (ST.bk === '0' ? '일치한 제품 없음' : '틀린 제품 없음 👍') + '</td></tr>') + '</tbody></table></div>' +
    (bad.length > shown.length ? '<div class="more"><button id="asMore">더 보기 (' + shown.length + ' / ' + bad.length + ')</button></div>' : '') + '</div>';

<script id="su-new-version-popup">
/* 새 버전 알림 팝업 (매출분석도구·원자재 사용현황과 같은 모양)
   GitHub 주소로 연 창은 20초 뒤 한 번, 그다음 5분마다, 그리고 창으로 돌아올 때 새 버전이 있는지 확인함.
   파일이 커서맨 앞의 meta su-ver 만 읽고 받기를 멈춤.
   새 버전이 있으면 화면 가운데 «새 버전 있음» 카드 → «새로고침» 누르면 새 버전으로 열림, «나중에»는 닫기(같은 버전은 다시 안 띄움). */
(function(){
'use strict';
var HERE=String(SUB_VER||''), busy=false, shownFor='';
function bn(v){ return +(String(v||'').replace(/\D/g,''))||0; }
function onPages(){ try{ return location.protocol==='https:'&&/\.github\.io$/i.test(location.hostname); }catch(_e){ return false; } }
function pop(ver){
  var b=document.getElementById('newVerPopSu');
  if(!b){ b=document.createElement('div'); b.id='newVerPopSu';
    b.style.cssText='position:fixed;inset:0;z-index:2147483000;background:rgba(15,23,42,.28);display:flex;align-items:center;justify-content:center;padding:16px';
    document.body.appendChild(b); }
  b.style.display='flex';
  b.innerHTML='<div style="background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(15,23,42,.25);width:300px;max-width:100%;padding:26px 24px 20px;text-align:center;font-family:inherit">'
    +'<div style="font-size:30px;line-height:1">🔄</div>'
    +'<div style="margin-top:12px;font-size:17px;font-weight:800;color:#0f172a">새 버전 있음</div>'
    +'<div style="margin-top:6px;font-size:13px;color:#64748b"><b style="color:#1d4ed8">'+ver+'</b> · 지금 화면 '+HERE+'</div>'
    +'<div style="margin-top:4px;font-size:12px;color:#94a3b8">새로고침하면 새 버전으로 열림</div>'
    +'<div style="display:flex;gap:8px;margin-top:18px">'
    +'<button type="button" data-k="later" style="flex:1;font:inherit;font-size:13px;font-weight:700;border:1px solid #cbd5e1;border-radius:9px;padding:9px 0;background:#fff;color:#475569;cursor:pointer">나중에</button>'
    +'<button type="button" data-k="go" style="flex:1;font:inherit;font-size:13px;font-weight:800;border:0;border-radius:9px;padding:9px 0;background:#17243b;color:#fff;cursor:pointer">새로고침</button>'
    +'</div></div>';
  b.querySelector('[data-k="go"]').onclick=function(){ location.reload(); };

window.suShowNewVerPop=pop;
var RE=/<meta name="su-ver" content="([^"]+)"/;
function headVer(){
  return fetch(location.origin+location.pathname+'?_v='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)return '';
    if(!r.body||!r.body.getReader)return r.text().then(function(t){var m=t.match(RE);return m?m[1]:'';});
    var rd=r.body.getReader(), dec=new TextDecoder(), txt='';
    function step(){ return rd.read().then(function(x){
      if(x.value)txt+=dec.decode(x.value,{stream:true});
      var m=txt.match(RE); if(m||x.done||txt.length>20000){ try{rd.cancel();}catch(_e){} return m?m[1]:''; }
      return step(); }); }
    return step();
  });
}
window.suCheckNewVer=function(){ return headVer(); };
function check(){
  if(!onPages()||busy)return; busy=true;
  headVer().then(function(there){
    if(!there||bn(there)<=bn(HERE)||shownFor===there)return;
    shownFor=there; pop(there);
  }).catch(function(){}).then(function(){ busy=false; });
}
if(onPages()){
  setTimeout(check,20000);
  setInterval(check,5*60*1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible')setTimeout(check,1500); });
}
})();
</script>

<script id="dbf-menu-v1" data-cur="subul" data-sel="header.topbar">
/* 업무분석도구 공통 메뉴(왼쪽 위 삼선) — 홈페이지와 같은 바로가기, 흰 바탕용 */
(function(){
  var me=document.currentScript, CUR=(me&&me.getAttribute('data-cur'))||'', SEL=(me&&me.getAttribute('data-sel'))||'', PAD=(me&&me.getAttribute('data-pad'))||'';
  var B='https://useran-coder.github.io/';
  var LINKS=[
    {k:'home',i:'🏠',n:'업무분석도구 홈',u:B+'bookmark/'},
    {sep:1},
    {k:'sales',i:'📈',n:'매출 분석 도구',u:B+'sales/'},
    {k:'purchase',i:'📦',n:'매입 분석 도구',u:B+'purchase/'},
    {k:'price',i:'💲',n:'단가표 만들기',u:B+'price/'},
    {k:'material',i:'🧱',n:'원자재 사용현황',u:B+'material/'},
    {k:'cost',i:'🧮',n:'가공비 견적기',u:B+'cost/'},
    {k:'coil',i:'🌀',n:'코일 슬리팅 조합 · 발주기',u:B+'coil/'},
    {k:'salesteam',i:'👥',n:'영업팀 업무분석',u:B+'salesteam/'},
    {k:'codematch',i:'🔗',n:'출고현황 Code Match',u:B+'codematch/'},
    {k:'subul',i:'🏭',n:'수불관리',u:B+'subul/'}
  ];
  /* dbf-menu-auto (2026-11-19): 바로가기 목록을 홈페이지(bookmark)의 도구 목록(TOOLS)에서 자동으로 받아 옴
     → 홈에 도구를 추가하면 모든 도구의 왼쪽 메뉴에 저절로 나타남. 위 목록은 받기 전·실패 때 쓰는 기본값 */
  var LKEY='dbfMenuToolsV2';
  function dbfmList(L){ return [LINKS[0],{sep:1}].concat(L); }
  try{ var lc0=JSON.parse(localStorage.getItem(LKEY)||'null'); if(lc0&&lc0.list&&lc0.list.length>2) LINKS=dbfmList(lc0.list); }catch(_e){}
  function dbfmFetch(){
    var lc=null; try{ lc=JSON.parse(localStorage.getItem(LKEY)||'null'); }catch(_e){}
    if(lc && lc.at && Date.now()-lc.at<30*60000) return;
    if(!window.fetch) return;
    fetch(B+'bookmark/',{cache:'no-cache'}).then(function(r){ return r.ok?r.text():''; }).then(function(t){
      var a=t.indexOf('var TOOLS'), b=a<0?-1:t.indexOf('];',a); if(b<0) return;
      var seg=t.slice(a,b), re=/key:\s*'([^']+)'\s*,\s*name:\s*'([^']+)'\s*,\s*icon:\s*'([^']+)'[\s\S]*?url:\s*'([^']+)'/g, m, L=[];
      while((m=re.exec(seg))) L.push({k:m[1],n:m[2],i:m[3],u:m[4]});
      if(L.length<3) return;
      try{ localStorage.setItem(LKEY, JSON.stringify({at:Date.now(), list:L})); }catch(_e){}
      var nl=dbfmList(L);
      if(JSON.stringify(nl)!==JSON.stringify(LINKS)){ LINKS=nl; if(dr && !dr.classList.contains('on')){ try{ dr.remove(); scrim.remove(); }catch(_e){} dr=null; } }
    }).catch(function(){});
  }
  setTimeout(dbfmFetch, 2500);
  var scrim, dr, btn;
  function build(){
    if(dr) return;
    scrim=document.createElement('div'); scrim.className='dbfm-scrim';
    dr=document.createElement('nav'); dr.className='dbfm-dr'; dr.setAttribute('aria-label','메뉴'); dr.setAttribute('aria-hidden','true');
    dr.innerHTML='<div class="dbfm-hd"><b>메뉴</b><button type="button" class="dbfm-x" aria-label="닫기">×</button></div><div class="dbfm-lb">바로가기</div>'+
      LINKS.map(function(l){
        if(l.sep) return '<div class="dbfm-sep"></div>';
        var c=l.k===CUR;
        return '<a href="'+l.u+'"'+(c?' class="cur" data-cur="1"':' target="_blank" rel="noopener"')+'><span class="i">'+l.i+'</span>'+l.n+'</a>';
      }).join('');
    document.body.appendChild(scrim); document.body.appendChild(dr);
    scrim.addEventListener('click', close);
    dr.querySelector('.dbfm-x').addEventListener('click', close);
    dr.addEventListener('click', function(e){
      var a=e.target.closest&&e.target.closest('a'); if(!a) return;
      if(a.getAttribute('data-cur')){ e.preventDefault(); }
      close();
    });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape' && dr.classList.contains('on')) close(); });
  }
  function open(){ build(); scrim.classList.add('on'); dr.classList.add('on'); dr.setAttribute('aria-hidden','false'); var f=dr.querySelector('a'); if(f) try{ f.focus({preventScroll:true}); }catch(_e){} }
  function close(){ if(!dr) return; scrim.classList.remove('on'); dr.classList.remove('on'); dr.setAttribute('aria-hidden','true'); if(btn) try{ btn.focus({preventScroll:true}); }catch(_e){} }
  // 버튼은 브라우저 왼쪽 위에 고정(홈페이지와 같은 자리). 머리글 왼쪽 끝(CI)이 버튼과 겹치면 머리글 왼쪽 여백만 늘림
  var host=null, roomFor=null, ROOM=14+40+14;
  function findHost(){ var h=null, sels=SEL.split('|'); for(var i=0;i<sels.length && !h;i++){ try{ h=document.querySelector(sels[i]); }catch(_e){} } return h; }
  function room(){
    if(!host || !host.isConnected) host=findHost();
    if(!host) return;
    // data-pad 가 있으면(영업팀: 머리글이 카드 모양) 머리글 자체를 재고 그 상자(body)의 왼쪽 여백을 늘림
    var tgt = PAD ? document.querySelector(PAD) : host; if(!tgt) return;
    tgt.style.removeProperty('padding-left');
    var fc=null;
    if(PAD){ fc=host.getBoundingClientRect(); }
    else { var k=host.children; for(var i=0;i<k.length;i++){ var r=k[i].getBoundingClientRect(); if(r.width>0 && r.height>0){ fc=r; break; } } }
    if(!fc || fc.width===0 || fc.top > 90) return;   // 머리글이 화면 위쪽에 없으면 그대로
    if(fc.left < ROOM){ var pl=parseFloat(getComputedStyle(tgt).paddingLeft)||0; tgt.style.setProperty('padding-left',(pl+ROOM-fc.left)+'px','important'); }
  }
  function place(){
    if(!btn || !btn.isConnected){
      btn=document.createElement('button'); btn.type='button'; btn.className='dbfm-btn'; btn.title='메뉴'; btn.setAttribute('aria-label','메뉴');
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
      btn.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); open(); });
      document.body.appendChild(btn);
    }
    if(!host || !host.isConnected || roomFor!==host){ room(); roomFor=host; }
    return true;
  }
  function start(){
    place();
    // 로그인 뒤에 화면이 만들어지거나 머리글을 다시 그리는 도구도 있어, 버튼이 없어지면 다시 붙임
    var q=0, mo=new MutationObserver(function(){ if(q) return; q=1; requestAnimationFrame(function(){ q=0; place(); }); });
    mo.observe(document.body,{childList:true,subtree:true});
    var rt=0; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(room, 120); });
  }
  window.dbfMenu={open:open,close:close};
  if(document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
