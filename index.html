<style>
:root{--navy:#17243b;--blue:#275caa;--line:#d8dee9;--muted:#64748b;--bg:#f4f6f9;--ok:#087a55;--warn:#ad5a00;--bad:#b42318;
  --c-inner:#7c3aed;--c-laser:#dc2626;--c-part:#2563eb;--c-oem:#0d9488}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;font-size:13px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.topbar{background:var(--navy);color:#fff;padding:9px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px #0f172a33}
.title{display:flex;align-items:center;gap:10px}.ci-logo{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px #ffffff22}
.title h1{font-size:20px;margin:0;letter-spacing:-.4px}
.ver-tag{font-size:11px;font-weight:700;color:#cbd5e1;border:1px solid #475569;border-radius:999px;padding:1px 8px}
.topbar .spacer{flex:1}
main{padding:12px 20px 40px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:8px 16px;font-weight:800;color:#334155;font-size:14px}
.tabs button small{margin-left:6px;font-weight:600;color:#94a3b8;font-size:11.5px}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}.tabs button.on small{color:#cbd5e1}
.tabs .cat-inner.on{background:var(--c-inner);border-color:var(--c-inner)}.tabs .cat-laser.on{background:var(--c-laser);border-color:var(--c-laser)}.tabs .cat-part.on{background:var(--c-part);border-color:var(--c-part)}.tabs .cat-oem.on{background:var(--c-oem);border-color:var(--c-oem)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #e0e5ed;border-radius:10px;padding:8px 10px;margin-bottom:8px;position:sticky;top:50px;z-index:30}
.bar .spacer{flex:1}
.views{display:flex;gap:4px}.views button{border:1px solid transparent;background:#f1f5f9;border-radius:8px;padding:7px 12px;font-weight:700;color:#475569}
.views button.on{background:#2f6ac6;color:#fff}
.datebox{display:flex;gap:3px;align-items:center}.datebox button,.datebox input{height:32px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:0 8px}
.search{height:32px;border:1px solid #cbd5e1;border-radius:7px;padding:0 10px;width:240px;max-width:100%}
#scope{height:32px;border:1px solid #cbd5e1;border-radius:7px;padding:0 6px}
.tbl-wrap{background:#fff;border:1px solid #e0e5ed;border-radius:10px;overflow:auto;max-height:calc(100vh - 175px)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.grid th{position:sticky;top:0;z-index:5;background:#59636f;color:#fff;font-weight:700;padding:6px 7px;white-space:nowrap;text-align:left;border-right:1px solid #6b7684}
.grid th small{display:block;font-weight:500;font-size:10.5px;color:#d1d5db}
.grid th.in{background:#2f5f9e}.grid th.st{background:#3f4a57}
.grid td{padding:3px 7px;border-bottom:1px solid #eef1f5;border-right:1px solid #f1f4f8;white-space:nowrap;vertical-align:middle}
.grid tr.first td{border-top:2px solid #cfd6e0}
.grid td.num,.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td.in{background:#f5f9ff;padding:1px 3px}
.grid td.st{font-weight:800;color:#0f172a;background:#fafbfc}
.grid tr.out td{background:#fffaf0}.grid tr.out td.in{background:#fff3dc}
.grid td.c-proc{font-weight:700;color:#334155}.grid .c-s,.grid .c-memo,.grid .c-n{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.grid .c-cust{max-width:130px;overflow:hidden;text-overflow:ellipsis}
.grid td.link{color:#1d4ed8;cursor:pointer;text-decoration:underline dotted}
.grid td.neg,.neg{color:var(--bad)!important}.ok{color:var(--ok)}
.grid td.empty{padding:40px;text-align:center;color:var(--muted);white-space:normal}
.qi{width:78px;height:26px;border:1px solid #c7d2e0;border-radius:5px;text-align:right;padding:0 6px;background:#fff}
.qi:focus{outline:2px solid #2f6ac6;border-color:#2f6ac6}.qi.bad{color:var(--bad)}.qi.pend{background:#fff7d6}.qi.err{background:#fee2e2}
.cb{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;background:#64748b}
.cb.cat-inner{background:var(--c-inner)}.cb.cat-laser{background:var(--c-laser)}.cb.cat-part{background:var(--c-part)}.cb.cat-oem{background:var(--c-oem)}
.warn-dot{display:inline-block;margin-left:4px;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:#f59e0b;color:#fff;font-weight:900;font-size:11px;cursor:help}
.lk{font-size:11px}
.muted{color:var(--muted)}.small{font-size:11.5px}
.more{text-align:center;padding:10px}.more button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 16px;font-weight:700}
.status{position:fixed;left:16px;bottom:12px;font-size:12px;color:var(--muted)}
.mbar{display:flex;gap:6px;align-items:center;margin:0 0 8px;flex-wrap:wrap}.mbar button{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:4px 10px;font-weight:700;color:#475569}.mbar button.on{background:#2f6ac6;border-color:#2f6ac6;color:#fff}
.grid.month td,.grid.month th{padding:3px 5px;font-size:12px}.grid.month th.day{cursor:pointer}.grid.month th.sun{color:#fecaca}.grid.month th.sat{color:#bfdbfe}
.grid th.today{background:#2f6ac6}.grid td.today{background:#eef4ff}.grid td.tot{font-weight:800;background:#fafbfc}
.ord{display:grid;gap:10px;max-width:1500px}
.card{background:#fff;border:1px solid #e0e5ed;border-radius:10px;padding:14px 16px}.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}.card.inner{margin-top:10px;background:#fbfcfe}
.fg{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;color:#475569}.fg label.w2{grid-column:span 2}
.fg input,.fg select{height:32px;border:1px solid #cbd5e1;border-radius:7px;padding:0 8px;font-weight:400;color:#1f2937}
.lbl{margin:12px 0 6px;font-weight:800;font-size:12.5px;color:#334155}.lbl small{font-weight:500}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:999px;padding:3px 4px 3px 10px;font-weight:700;font-size:12px}
.chip button{border:0;background:transparent;color:#94a3b8;font-size:14px;line-height:1;padding:0 4px}.chip button:hover{color:var(--bad)}
.addp{height:28px;border:1px dashed #94a3b8;border-radius:999px;padding:0 8px;background:#fff;color:#475569}
.act{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}.act.end{border-top:1px solid #eef1f5;padding-top:12px}.act .spacer{flex:1}
.act button,.card button{border:1px solid #b9c5d6;background:#fff;color:#26354d;border-radius:7px;padding:7px 13px;font-weight:700}
button.primary{background:#2f6ac6!important;color:#fff!important;border-color:#2f6ac6!important}button.danger{background:#fff!important;color:var(--bad)!important;border-color:#f3b4ad!important}
button.small{padding:3px 9px!important;font-size:11.5px}button:disabled{opacity:.5;cursor:default}
.msg{font-size:12.5px;font-weight:700;color:var(--ok)}
textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:8px;font-size:12px}
.grid.small{font-size:12px}.grid.small th{position:static}
.tplrow{display:flex;gap:10px;align-items:center;margin-bottom:8px}.tplrow b{width:70px}
.improw{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.improw select{height:30px;border:1px solid #cbd5e1;border-radius:6px}
.kv{font-size:12.5px;margin:6px 0;line-height:1.6}
.note{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0;line-height:1.6}.note.warn{background:#fff7e6;border-color:#f6d28b;color:#7a4500}
.diag{white-space:pre-wrap;font-size:12px;background:#f8fafc;border-radius:8px;padding:8px;min-height:0}.diag:empty{display:none}
.modal{position:fixed;inset:0;z-index:100;background:#0f172a66;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal-box{width:100%;max-width:620px;background:#fff;border-radius:12px;box-shadow:0 20px 50px #0f172a40;padding:18px 20px}.modal-box.wide{max-width:1100px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.modal-head h2{margin:0;font-size:17px;color:var(--navy)}
.modal-x{border:0;background:transparent;font-size:22px;color:#64748b}
.grid.procs td{white-space:normal}.grid.procs input{height:28px;border:1px solid #cbd5e1;border-radius:6px;padding:0 6px}.grid.procs input.num{width:90px;text-align:right}
.grid.procs button{border:1px solid #d5dce6;background:#fff;border-radius:5px;padding:1px 6px;margin-right:2px}
.ck{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
.links .chip{margin:2px}
.lk-list{max-height:330px;overflow:auto;margin:8px 0;border:1px solid #eef1f5;border-radius:8px}
.lk-it{padding:6px 8px;border-bottom:1px solid #f1f4f8;font-size:12.5px}.lk-it button{margin:3px 3px 0 0;border:1px solid #b9c5d6;background:#fff;border-radius:999px;padding:2px 9px;font-size:12px}
.lk-it button:hover{background:#2f6ac6;color:#fff}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:6px;max-width:440px}
.toast{background:#0f172a;color:#fff;padding:9px 13px;border-radius:9px;font-size:12.5px;box-shadow:0 6px 18px #0f172a40;transition:opacity .4s}.toast.warn{background:#92400e}.toast.bad{background:#991b1b}.toast.out{opacity:0}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:900px){.fg{grid-template-columns:repeat(2,1fr)}.search{width:100%}.bar{position:static}}

.card .chip button,.chip button{border:0!important;background:transparent!important;color:#94a3b8;font-size:14px;line-height:1;padding:0 4px!important;box-shadow:none}

/* v2 : ERP 연동 · 빠른 입력 · 현황판 */
.erp{display:inline-block;font-size:11px;font-weight:800;color:#1d4ed8;background:#e8f0ff;border-radius:5px;padding:1px 6px}.erp.over{color:#94a3b8;background:#f1f5f9;text-decoration:line-through}
.erpc{color:#1d4ed8!important;font-weight:700}
.erp-tag{display:inline-block;margin-left:4px;font-size:10px;font-weight:800;color:#1d4ed8;border:1px solid #93b4f0;border-radius:4px;padding:0 4px}
#procF{height:32px;border:1px solid #cbd5e1;border-radius:7px;padding:0 6px;max-width:150px}
.qk{margin-bottom:8px;padding:10px 14px;border-color:#bcd0f0;background:#f7faff}.qk-head{display:flex;align-items:center;gap:8px}.qk-head .spacer{flex:1}
.qk.closed .qk-body{display:none}
.qk-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.qk-row label{display:flex;flex-direction:column;font-size:11.5px;font-weight:700;color:#475569;gap:2px}
.qk-row select{height:30px;border:1px solid #cbd5e1;border-radius:6px;min-width:110px}.qk-row .qi{width:90px;height:30px}
.qk-find{position:relative}.qk-find input{width:280px;height:32px;border:1px solid #93b4f0;border-radius:7px;padding:0 10px}
.qk-sug{position:absolute;top:34px;left:0;z-index:60;width:620px;max-width:90vw;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px #0f172a30;max-height:340px;overflow:auto}
.qs{padding:6px 9px;border-bottom:1px solid #f1f4f8;cursor:pointer;font-size:12.5px}.qs.hi,.qs:hover{background:#eef4ff}
.qk-sel{min-width:260px;max-width:520px;font-size:12.5px;padding:2px 0}.qk-sel .link{color:#1d4ed8;cursor:pointer;text-decoration:underline dotted}
.qk-log{margin-top:6px;font-size:12px;color:#334155}.qk-log div{padding:2px 0}.qk-log .undone{color:#94a3b8;text-decoration:line-through}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid #e0e5ed;border-radius:10px;padding:10px 12px}.kpi.go{cursor:pointer}.kpi.go:hover{border-color:#2f6ac6}
.k-l{font-size:12px;font-weight:700;color:#64748b}.k-v{font-size:22px;font-weight:900;color:#0f172a;margin:2px 0;font-variant-numeric:tabular-nums}.k-s{font-size:11.5px;color:#64748b}
.kpi.warn .k-v{color:var(--warn)}.kpi.bad .k-v{color:var(--bad)}
.chart-card{margin-bottom:10px}.chart-wrap{position:relative}.chart{width:100%;height:240px;display:block;overflow:visible}
.chart .gl{stroke:#eef1f5;stroke-width:1}.chart .base{stroke:#94a3b8;stroke-width:1}.chart .ax{font-size:11px;fill:#64748b}
.chart .b1,.sw.b1{fill:#2a78d6;background:#2a78d6}.chart .b2,.sw.b2{fill:#eb6834;background:#eb6834}
.chart .hit{fill:transparent;cursor:pointer}.chart .hit.on{fill:#0f172a0d}
.legend{display:flex;gap:16px;font-size:12px;color:#334155;margin:-4px 0 4px}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:absolute;display:none;pointer-events:none;background:#0f172a;color:#fff;font-size:12px;padding:7px 10px;border-radius:7px;min-width:150px;box-shadow:0 6px 18px #0f172a40}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.grid tr.go{cursor:pointer}.grid tr.go:hover td{background:#eef4ff}
.barc{width:120px}.hbar{display:block;height:8px;border-radius:0 4px 4px 0;background:#2a78d6}
.alerts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.al{border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.7}
.al.bad{border-color:#f3b4ad;background:#fff8f7}.al.warn{border-color:#f6d28b;background:#fffbf0}.al .link{color:#1d4ed8;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid tr.stk td{font-size:11px;border-top:0}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.dash-grid,.alerts,.two{grid-template-columns:1fr}}

/* v3 : 바로가기 · 날짜 지정 입력 */
.top-link{color:#dbeafe;text-decoration:none;border:1px solid #6b7a92;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}.top-link:hover{background:#ffffff14}
.btn-link{display:inline-block;border:1px solid #2f6ac6;background:#2f6ac6;color:#fff;border-radius:7px;padding:7px 13px;font-weight:700;text-decoration:none}
.qk-date{display:flex;gap:3px;align-items:center}.qk-date input{height:30px;border:1px solid #cbd5e1;border-radius:6px;padding:0 6px}.qk-date button{height:30px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:0 8px}
.qk.past{background:#fffbeb;border-color:#f6c768}.qk.past #qkD{border-color:#d97706;background:#fff7e0;font-weight:800}
.qk.fut{background:#fff5f5;border-color:#f3b4ad}
.qk-flag{display:inline-block;margin-left:6px;background:#fde68a;color:#7a4500;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:800}.qk-flag.bad{background:#fecaca;color:#991b1b}

.grid th.sortable{cursor:pointer;user-select:none}.grid th.sortable:hover{filter:brightness(1.15)}.grid th.sorted{box-shadow:inset 0 -3px 0 #fbbf24}.grid th .sarr{margin-left:4px;font-size:10px;color:#fbbf24}.grid th.num .sarr{float:left;margin:0 4px 0 0}.grid th .dgo{margin-left:2px;font-size:10px;opacity:.65;cursor:pointer}.grid th .dgo:hover{opacity:1;color:#fbbf24}
.selF{height:32px;border:1px solid #cbd5e1;border-radius:7px;padding:0 8px;width:175px;font:inherit;font-size:13px}.selF.on{border-color:#2f6ac6;background:#eef4ff;font-weight:700}
.grid td.bcell{padding:1px 3px}.grid input.bi{width:72px;height:24px;border:1px solid transparent;border-radius:5px;background:transparent;text-align:right;font:inherit;font-variant-numeric:tabular-nums;color:#475569;padding:0 5px}.grid input.bi:hover{border-color:#cbd5e1;background:#fff}.grid input.bi:focus{border-color:#2f6ac6;background:#fff;outline:0;color:#0f172a}.grid td.adj input.bi{color:#b45309;font-weight:700}.grid input.bi.err{border-color:#ef4444}
.topbar .top-tabs{margin:0 0 0 6px;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.topbar .top-tabs::-webkit-scrollbar{display:none}
.topbar .top-tabs button{height:32px;padding:0 12px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:transparent;color:#e2e8f0;font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center}
.topbar .top-tabs button:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.34);color:#fff}
.topbar .top-tabs button small{color:#94a3b8;margin-left:6px}
.topbar .top-tabs button.on{background:#fff;border-color:#fff;color:#17243b}.topbar .top-tabs button.on small{color:#64748b}
.topbar .top-tabs .cat-inner.on{background:var(--c-inner);border-color:var(--c-inner);color:#fff}.topbar .top-tabs .cat-laser.on{background:var(--c-laser);border-color:var(--c-laser);color:#fff}.topbar .top-tabs .cat-part.on{background:var(--c-part);border-color:var(--c-part);color:#fff}.topbar .top-tabs .cat-oem.on{background:var(--c-oem);border-color:var(--c-oem);color:#fff}
.topbar .top-tabs .cat-inner.on small,.topbar .top-tabs .cat-laser.on small,.topbar .top-tabs .cat-part.on small,.topbar .top-tabs .cat-oem.on small{color:#ffffffcc}
@media(max-width:1100px){.topbar{flex-wrap:wrap}.topbar .top-tabs{order:3;flex-basis:100%;margin:2px 0 0}}
.cbx{position:relative;display:inline-block}
.cbx-list{display:none;position:absolute;left:0;top:calc(100% + 2px);z-index:60;min-width:100%;width:max-content;max-width:340px;max-height:320px;overflow-y:auto;background:#fff;border:1px solid #64748b;box-shadow:0 6px 18px #0f172a2e;padding:2px 0}
.cbx-list.open{display:block}
.cbx-it{display:flex;align-items:center;gap:12px;padding:5px 10px;font-size:13.5px;color:#1e293b;cursor:pointer;white-space:nowrap}
.cbx-it span{flex:1;overflow:hidden;text-overflow:ellipsis}.cbx-it small{color:#94a3b8;font-size:11px}
.cbx-it.all{color:#64748b;border-bottom:1px solid #eef1f5}
.cbx-it.cur{font-weight:700}
.cbx-it:hover,.cbx-it.hi{background:#2f6ac6;color:#fff}.cbx-it:hover small,.cbx-it.hi small{color:#dbeafe}
.cbx-none{padding:6px 10px;color:#94a3b8;font-size:12px}

    /* 로그인 (매출분석도구와 같은 계정) */
    html:not(.au-in) body>*:not(#auGate){visibility:hidden!important}
    #auGate{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;visibility:visible!important}
    #auForm{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #0f172a1f;padding:26px 24px 20px}
    #auForm .au-h{text-align:center;margin-bottom:16px}#auForm .au-t{font-size:18px;font-weight:800;color:var(--navy)}#auForm .au-s{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
    #auForm .au-l{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 4px}
    #auForm .au-i{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px}
    #auForm .au-c{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;font-weight:600;cursor:pointer}#auForm .au-c span{color:var(--muted);font-weight:500}
    #auForm .au-b{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:14px;font-weight:800}#auForm .au-b:disabled{opacity:.6}
    #auForm .au-m{margin-top:10px;font-size:11.5px;font-weight:600;white-space:pre-line;text-align:center;min-height:14px}
    #auForm .au-srv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
    #auForm .au-srv-t,#auForm .au-b2{width:100%;padding:7px;border:1px solid var(--line);background:transparent;border-radius:9px;font-size:11.5px;font-weight:700}
    #auForm .au-f{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);line-height:1.6}
    .au-kl{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.au-kl a{flex:1;text-align:center;padding:7px 8px;border:1px solid var(--blue);border-radius:8px;color:var(--blue);font-weight:700;text-decoration:none;font-size:12.5px}
    #auChip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;color:#e2e8f0}#auChip:empty{display:none}
    #auChip small{color:#bbf7d0;border:1px solid #4ade8066;border-radius:999px;padding:1px 7px;font-weight:700}
    #auChip button{border:1px solid #fca5a5;background:transparent;color:#fecaca;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700}

    /* 상단 버튼 (출고매칭 v21과 같은 디자인) */
    .top-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .tb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:transparent;color:#e2e8f0;font-family:inherit;font-size:12.5px;font-weight:600;line-height:1;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
    .tb:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.34);color:#fff}
    .tb.pri{background:#fff;border-color:#fff;color:#17243b}.tb.pri:hover{background:#e2e8f0;border-color:#e2e8f0;color:#17243b}
    .tb.danger:hover{background:#b42318;border-color:#b42318;color:#fff}
    .tb .t{color:#94a3b8;font-weight:500}.tb.busy{opacity:.7}.tb.err{border-color:#f87171;color:#fecaca}
    .tb-sep{width:1px;height:20px;background:rgba(255,255,255,.16);margin:0 4px}
    #auChip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap;color:#e2e8f0}#auChip:empty{display:none}
    #auChip b{font-weight:600}
    #auChip small{font-size:11px;font-weight:600;color:#bbf7d0;background:rgba(74,222,128,.14);border:0;border-radius:6px;padding:3px 7px}
    #auChip button{height:28px;padding:0 10px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#cbd5e1;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
    #auChip button:hover{border-color:#f87171;color:#fecaca;background:rgba(248,113,113,.1)}
    @media(max-width:640px){.tb-sep{display:none}.top-actions .tb{flex:1;justify-content:center}}

<script>
/* ═══════════════════════════════════════════════════════════
   수불관리 — 자료 구조 · 재고 계산 · 구글시트 가져오기 (화면과 분리된 부분, node 시험에서도 씀)
   ─ 기록(rec) 종류 (키 앞글자)
     i:<품목id>                    품목(수주) {cat,src,seq,cust,ord,p,it,n,s,memo,wt,oq,od,due,d0,procs:[{id,n,o0,nx,out:[{i,p,q}]}],chk}
     e:<품목id>|<공정id>|<날짜>      하루 입력 {g:양품(출고 공정은 출고수량), b:불량}
     c:procs                       공정 목록·구분별 기본 공정
     c:erp                         ERP 연동 설정 {from: 이 날짜부터 수주·출고를 자동 반영}
   ─ ERP 연동 (출고현황 개별번호 매칭 프로그램이 서버에 모아 둔 수주현황·출고현황 = smGet)

     · 출고 줄 → 같은 방법으로 품목을 찾아 출고 공정에 더함. 그날 출고 칸을 사람이 직접 넣었으면 직접 넣은 값이 우선
     · ERP 품목에 생산을 입력하면 그 품목은 보통 품목으로 저장됨(id 그대로)
   ─ 재고 계산 (지금 구글시트 수식과 같음)
     공정 재고(날짜 D) = 기초재고 + Σ양품 − Σ다음 공정 생산(양품+불량) − Σ(연결된 다른 품목 공정 생산 × 소요수량)
     기간은 품목 기준일(d0, 기초재고 날짜) 다음 날부터 D 까지
   ═══════════════════════════════════════════════════════════ */
var SU = (function () {

    { id: 'laser', name: '레이저' },
    { id: 'part',  name: '부자재' },
    { id: 'oem',   name: '유통/OEM' }
  ];
  var CAT_NAME = {}; CATS.forEach(function (c) { CAT_NAME[c.id] = c.name; });
  var OUT = '출고';
  var DEFAULT_TPL = {
    inner: ['포밍', '타공', '탭핑', '포장', OUT],
    laser: ['레이저', '절곡', '포장', OUT],
    part:  ['블랭킹', '탭핑', '조립/포장', OUT],
    oem:   [OUT]          // 유통/OEM : 수주·출고만 (ERP 자동)
  };
  /* 공정 이름 표기 통일 (지금 시트에서 섞여 쓰인 것) */
  var PROC_ALIAS = { '텝핑': '탭핑', '타공2차': '타공(2차)', '타공)국산오)': '타공(국산오)' };
  function normProc(n) {
    n = String(n == null ? '' : n).replace(/\s+/g, ' ').trim();
    return PROC_ALIAS[n] || n;
  }
  function isOut(n) { return normProc(n) === OUT; }

  /* 숫자 읽기 : «18,652» «-» «250+250» «1.5» 모두 */
  function num(v) {
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v).replace(/[\uFF10-\uFF19\uFF0E\uFF0B\uFF0D]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/,/g, '').trim();   // 전각 숫자(２) 도 숫자로
    if (!s || s === '-' || /%$/.test(s)) return 0;
    if (/^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(s)) return Number(s);
    if (/^=?[\d+\-*/(). ]+$/.test(s)) { try { var r = Function('"use strict";return (' + s.replace(/^=/, '') + ')')(); return isFinite(r) ? r : 0; } catch (e) { return 0; } }
    return 0;
  }
  /* 날짜 : «2026-11-1 (일)» «2026/11/01» «2026-11-01» «20261101» → «2026-11-01» */
  function ymd(v) {
    if (v == null) return '';
    if (v instanceof Date) return v.getFullYear() + '-' + p2(v.getMonth() + 1) + '-' + p2(v.getDate());
    var s = String(v).trim(), m;
    if ((m = /^(\d{4})[-./](\d{1,2})[-./](\d{1,2})/.exec(s))) return m[1] + '-' + p2(m[2]) + '-' + p2(m[3]);
    if ((m = /^(\d{4})(\d{2})(\d{2})$/.exec(s))) return m[1] + '-' + m[2] + '-' + m[3];
    return '';
  }
  function p2(n) { n = Number(n); return (n < 10 ? '0' : '') + n; }
  function addDays(d, n) { var t = new Date(d + 'T00:00:00'); t.setDate(t.getDate() + n); return ymd(t); }
  function today() { return ymd(new Date()); }
  function monthStart(d) { return d.slice(0, 8) + '01'; }
  function monthEnd(d) { var t = new Date(d.slice(0, 7) + '-01T00:00:00'); t.setMonth(t.getMonth() + 1); t.setDate(0); return ymd(t); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function hash(s) { var h1 = 0x811c9dc5, h2 = 0x1234567; for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519); } return ((h1 >>> 0).toString(36) + (h2 >>> 0).toString(36)); }

  /* ───────── 자료 모음 (recs: key → {v,r,by,at}) ───────── */
  function Store() { this.recs = new Map(); this.items = new Map(); this.ent = new Map(); this.adj = new Map(); this.cfg = null; this.ix = null; this.dirtyIx = true;
    this.erp = { ship: new Map(), order: new Map(), up: new Map(), rev: 0, epoch: '' }; this.erpCfg = null; this.dead = new Set(); this.virt = new Set();
    this.erpOut = new Map(); this.erpOrd = new Map(); this.erpShip = new Map(); this.erpOq = new Map(); this.erpInfo = null; this.erpDirty = true; }
  Store.prototype.set = function (k, v, meta) {
    var old = this.recs.get(k);
    var rec = { v: v, r: meta && meta.r != null ? meta.r : (old ? old.r : 0), by: meta && meta.by || '', at: meta && meta.at || '' };
    this.recs.set(k, rec);
    var t = k.charAt(0);
    if (t === 'i') { var id = k.slice(2); this.virt.delete(id); if (v && !v.del) { v.id = id; this.items.set(id, v); this.dead.delete(id); } else { this.items.delete(id); this.dead.add(id); } this.erpDirty = true; }
    else if (t === 'e') { if (v && (v.g || v.b)) this.ent.set(k.slice(2), v); else this.ent.delete(k.slice(2)); }
    else if (t === 'a') { if (v && num(v.a)) this.adj.set(k.slice(2), v); else this.adj.delete(k.slice(2)); }   /* 기초재고 조정 a:품목|공정|날짜 {a: 더할 수량} */
    else if (k === 'c:procs') this.cfg = v;
    else if (k === 'c:erp') { this.erpCfg = v; this.erpDirty = true; }
    this.dirtyIx = true;
  };
  Store.prototype.clear = function () { this.recs.clear(); this.items.clear(); this.ent.clear(); this.adj.clear(); this.cfg = null; this.erpCfg = null; this.dead.clear(); this.virt.clear(); this.dirtyIx = true; this.erpDirty = true; };
  Store.prototype.procList = function () {
    var set = {}, out = [];
    function add(n) { n = normProc(n); if (n && !set[n]) { set[n] = 1; out.push(n); } }
    var cfg = this.cfg || {};
    (cfg.list || []).forEach(add);
    CATS.forEach(function (c) { ((cfg.tpl && cfg.tpl[c.id]) || DEFAULT_TPL[c.id]).forEach(add); });
    this.items.forEach(function (it) { (it.procs || []).forEach(function (p) { add(p.n); }); });
    return out;
  };
  Store.prototype.tpl = function (cat) { var c = this.cfg; return ((c && c.tpl && c.tpl[cat]) || DEFAULT_TPL[cat] || [OUT]).slice(); };

  /* 색인 : 공정별 날짜 정렬 + 누적합 → 기간 합계를 빠르게 */
  Store.prototype.index = function () {
    this.deriveErp();
    if (!this.dirtyIx && this.ix) return this.ix;
    var by = new Map(), self = this;
    this.ent.forEach(function (v, k) {
      var a = k.lastIndexOf('|'), pk = k.slice(0, a), d = k.slice(a + 1);
      var L = by.get(pk); if (!L) { L = []; by.set(pk, L); }
      L.push([d, num(v.g), num(v.b), 0]);
    });
    this.adj.forEach(function (v, k) {
      var a = k.lastIndexOf('|'), pk = k.slice(0, a), d = k.slice(a + 1);
      var L = by.get(pk); if (!L) { L = []; by.set(pk, L); }
      L.push([d, 0, 0, num(v.a)]);
    });
    /* ERP 출고 : 그날 직접 넣은 출고가 없을 때만 */
    this.erpOut.forEach(function (m, id) {
      var it = self.items.get(id), pr = it && outProc(it); if (!pr) return;
      var pk = id + '|' + pr.id;
      m.forEach(function (q, d) { if (self.ent.has(pk + '|' + d)) return; var L = by.get(pk); if (!L) { L = []; by.set(pk, L); } L.push([d, q, 0, 0]); });
    });
    var ix = new Map();
    by.forEach(function (L, pk) {
      L.sort(function (x, y) { return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0; });
      var ds = new Array(L.length), G = new Array(L.length + 1), P = new Array(L.length + 1), B = new Array(L.length + 1), A = new Array(L.length + 1);
      G[0] = 0; P[0] = 0; B[0] = 0; A[0] = 0;
      for (var i = 0; i < L.length; i++) { ds[i] = L[i][0]; G[i + 1] = G[i] + L[i][1]; B[i + 1] = B[i] + L[i][2]; P[i + 1] = P[i] + L[i][1] + L[i][2]; A[i + 1] = A[i] + L[i][3]; }
      ix.set(pk, { ds: ds, G: G, P: P, B: B, A: A });
    });
    this.ix = ix; this.dirtyIx = false;
    return ix;
  };
  function upto(ds, d) { var lo = 0, hi = ds.length; while (lo < hi) { var m = (lo + hi) >> 1; if (ds[m] <= d) lo = m + 1; else hi = m; } return lo; }
  /* (a, b] 기간 합계 {g 양품, b 불량, p 생산} */
  Store.prototype.sum = function (itemId, pid, a, b) {
    var x = this.index().get(itemId + '|' + pid);
    if (!x || b <= a) return { g: 0, b: 0, p: 0, a: 0 };
    var i = upto(x.ds, a), j = upto(x.ds, b);
    return { g: x.G[j] - x.G[i], b: x.B[j] - x.B[i], p: x.P[j] - x.P[i], a: x.A[j] - x.A[i] };
  };
  /* 그날 값 (출고 공정은 직접 입력이 없으면 ERP 출고 {g, erp:true}) */
  Store.prototype.day = function (itemId, pid, d) {
    var e = this.ent.get(itemId + '|' + pid + '|' + d); if (e) return e;
    this.deriveErp();
    var m = this.erpOut.get(itemId); if (!m || !m.has(d)) return null;
    var it = this.items.get(itemId), pr = it && outProc(it);
    return pr && pr.id === pid ? { g: m.get(d), erp: true } : null;
  };
  Store.prototype.manual = function (itemId, pid, d) { return this.ent.get(itemId + '|' + pid + '|' + d) || null; };
  Store.prototype.erpDay = function (itemId, d) { this.deriveErp(); var m = this.erpOut.get(itemId); return m && m.has(d) ? m.get(d) : null; };
  /* 공정 재고 (날짜 d 끝) — 출고 공정은 null */
  Store.prototype.stock = function (it, pi, d) {
    var pr = it.procs[pi]; if (!pr || isOut(pr.n)) return null;
    var d0 = it.d0 || '0000-00-00';
    if (d < d0) return null;
    var s0 = this.sum(it.id, pr.id, d0, d), s = num(pr.o0) + s0.g + s0.a;
    var nx = it.procs[pi + 1];
    if (pr.nx !== false && nx) s -= this.sum(it.id, nx.id, d0, d).p;
    var self = this;
    (pr.out || []).forEach(function (o) { var t = self.items.get(o.i); if (!t) return; s -= num(o.q || 1) * self.sum(t.id, o.p, d0, d).p; });
    return Math.round(s * 1000) / 1000;
  };

  /* ───────── ERP 연동 (출고현황 개별번호 매칭 자료) ───────── */
  function outProc(it) { var ps = it.procs || []; for (var i = ps.length - 1; i >= 0; i--) if (isOut(ps[i].n)) return ps[i]; return null; }
  /* 완성 공정 = 출고 바로 앞 공정 (없으면 마지막 공정) */
  function finIndex(it) { var ps = it.procs || []; for (var i = ps.length - 1; i >= 0; i--) if (!isOut(ps[i].n)) return i; return -1; }
  /* 출고매칭 프로그램과 같은 구분 규칙 */
  function catOfErp(r) {
    var n = String(r.n || ''), p = String(r.p || '');
    if (/[(（\[]\s*L\s*[)）\]]/i.test(n) || /LASER/i.test(n) || n.indexOf('레이저') >= 0 || n.indexOf('임가공') >= 0) return 'laser';
    if (/_G$/i.test(p.trim())) return 'oem';
    if (/상하\s*보강|이너\s*프레임|INNER\s*FRAME/i.test(n)) return 'inner';
    return 'part';
  }
  /* 개별번호 : 내부보강 B12345 · 레이저 D1234 (비고·규격에 적힌 것) */
  function codesOf(t) { var m = String(t || '').toUpperCase().match(/(?:^|[^A-Z0-9])([BD]\d{3,6})(?![0-9])/g) || []; return m.map(function (x) { return x.replace(/^[^BD]/, ''); }); }
  function nk(s) { return String(s || '').replace(/\s+/g, '').toUpperCase(); }
  Store.prototype.setErp = function (res) {
    var E = this.erp, n = 0;
    if (!res) return 0;

var METRICS = { stock: '재고', p: '생산', g: '양품', b: '불량', out: '출고' };

/* 월 현황 기초재고 고치기

   · 그 뒤 달이면 → 전월말에 «재고 조정» a:품목|공정|날짜 {a} 로 차이만 기록 (이전 달 숫자는 그대로) */

  var before = SU.addDays(SU.monthStart(S.ui.date), -1), cur = store.stock(it, pi, before); if (cur == null) return;
  if (Math.abs(x - cur) < 1e-9) return;

    setRec(k, na ? { a: na } : null); toast('전월말 재고 조정: ' + (it.p || it.n) + ' ' + pr.n + ' ' + fmt(cur, false) + ' → ' + fmt(x, false) + ' (조정 ' + fmt(na) + ')');

async function impList() {
  var box = $('#impBox'); box.innerHTML = '시트 목록 읽는 중…';
  try {
    var d = await api({ action: 'suSrcList' }, 120000);
    box.innerHTML = '<div class="note">처음 옮길 때 한 번 하는 작업. 같은 시트를 다시 가져오면 같은 품목은 덮어씀(웹에서 고친 공정·기초재고도 시트 값으로 바뀜). 가져온 뒤 그 날짜까지의 생산·출고가 들어옴</div>' +
      d.sources.map(function (s) { return '<div class="improw" data-src="' + s.id + '"><b>' + esc(s.name) + '</b> <span class="cb cat-' + s.cat + '">' + esc(SU.CAT_NAME[s.cat]) + '</span> ' + (s.error ? '<span class="neg">' + esc(s.error) + '</span>' : '<select>' + s.tabs.map(function (t) { return '<option value="' + esc(t.name) + '">' + esc(t.name) + ' (' + t.rows.toLocaleString() + '줄)</option>'; }).join('') + '</select> <button type="button" data-go="' + s.id + '">읽기</button>') + '<span class="msg"></span></div>'; }).join('') +
      '<div id="impRes"></div>';
    box.onclick = function (ev) { var g = ev.target.dataset.go; if (!g) return; var row = ev.target.closest('.improw'); var s = d.sources.filter(function (x) { return x.id === g; })[0]; impRead(s, $('select', row).value, $('.msg', row)); };
  } catch (e) { box.innerHTML = '<span class="neg">' + esc(e.message) + '</span>'; }
}
async function impRead(src, tab, msg) {
  try {
    msg.textContent = '머리글 읽는 중…';
    var h = await api({ action: 'suSrcRead', src: src.id, tab: tab, r1: 1, n: 8 }, 120000);
    var L = SU.findLayout(h.values);
    var dr = h.values[L.dateRow] || [], td = SU.today(), lastK = 0;
    for (var j = 0; j < 31; j++) { var dd = SU.ymd(String(dr[L.day0 + 5 * j] || '').replace(/\s*\(.*\)$/, '')); if (!dd) break; if (dd <= td) lastK = j; }
    var fc1 = L.day0 + 5, fcL = L.day0 + 5 * lastK + 5, cols = L.day0 + 5 * 31;
    var rows = [], f1 = {}, fL = {}, last = h.last, step = 1500;
    for (var r1 = 1; r1 <= last; r1 += step) {
      msg.textContent = '읽는 중… ' + Math.min(last, r1 + step - 1).toLocaleString() + ' / ' + last.toLocaleString() + '줄';
      var c = await api({ action: 'suSrcRead', src: src.id, tab: tab, r1: r1, n: step, cols: cols, fcols: [fc1, fcL] }, 300000);
      c.values.forEach(function (row, i) { rows[r1 - 1 + i] = row; var f = c.f[i] || []; if (f[0]) f1[r1 + i] = f[0]; if (f[1]) fL[r1 + i] = f[1]; });
    }
    for (var i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
    msg.textContent = '정리 중…';
    var P = SU.parseSource(rows, { f1: f1, fL: fL, lastK: lastK }, src.id, src.cat);
    /* 임시 계산 → 시트 재고와 비교 */
    var tmp = new SU.Store();
    P.items.forEach(function (it) { tmp.set('i:' + it.id, SU.cleanForSave(it)); }); P.ents.forEach(function (e) { tmp.set(e.k, e.v); });
    store.items.forEach(function (it, id) { if (!tmp.items.has(id)) tmp.set('i:' + id, it); });
    var V = SU.verify(tmp, P, P.dates[lastK]);
    S.imp = { src: src, tab: tab, P: P, V: V };
    msg.textContent = '';
    var exist = P.items.filter(function (it) { return store.items.has(it.id); }).length;
    $('#impRes').innerHTML = '<div class="card inner"><h3>' + esc(src.name) + ' · ' + esc(tab) + '</h3>' +
      '<div class="kv">품목 ' + P.items.length.toLocaleString() + ' (이미 있음 ' + exist.toLocaleString() + ') · 공정 ' + P.items.reduce(function (a, i) { return a + i.procs.length; }, 0).toLocaleString() + ' · 입력 칸 ' + P.ents.length.toLocaleString() + ' · 기초재고 날짜 ' + P.base + ' · 연결(조립 등) ' + P.stat.link + '곳</div>' +
      '<div class="kv">재고 대조 (' + V.day + '): ' + V.checked.toLocaleString() + '줄 중 <b class="' + (V.bad.length ? 'neg' : 'ok') + '">' + V.bad.length + '줄 다름</b>' + (V.bad.length ? ' — 시트 수식 오류(#REF!·행 순서 바뀜·마이너스가 «-»로 보임) 때문인 경우가 대부분. 웹은 기초재고+입력으로 다시 계산' : ' — 시트와 같음') + '</div>' +
      (V.bad.length ? '<table class="grid small"><thead><tr><th>시트 행</th><th>품번</th><th>품명</th><th>공정</th><th class="num">시트 재고</th><th class="num">웹 계산</th></tr></thead><tbody>' + V.bad.slice(0, 50).map(function (b) { return '<tr><td>' + b.row + '</td><td>' + esc(b.it.p) + '</td><td>' + esc(b.it.it || b.it.n) + '</td><td>' + esc(b.proc) + '</td><td class="num">' + fmt(b.sheet) + '</td><td class="num">' + fmt(b.calc) + '</td></tr>'; }).join('') + '</tbody></table>' : '') +
      '<div class="kv">확인 필요 표시 품목 ' + P.items.filter(function (i) { return i.chk; }).length + '개 (#REF!·현재고 칸 사용 등 — 가져온 뒤 «확인 필요»로 볼 수 있음)' + (P.issues.length ? ' · 읽기 문제 ' + P.issues.length + '건: ' + esc(P.issues.slice(0, 3).join(' / ')) : '') + '</div>' +
      '<div class="act"><button type="button" id="impGo" class="primary">서버에 저장 (' + (P.items.length + P.ents.length).toLocaleString() + '건)</button><span class="msg" id="impMsg"></span></div></div>';
    $('#impGo').onclick = impSave;
  } catch (e) { msg.innerHTML = '<span class="neg">' + esc(e.message) + '</span>'; }
}
async function impSave() {
  var I = S.imp; if (!I) return;
  if (!confirm(I.src.name + ' «' + I.tab + '» 를 서버에 저장. 같은 품목은 시트 값으로 덮어씀. 진행할까?')) return;
  var btn = $('#impGo'), msg = $('#impMsg'); btn.disabled = true;
  try {
    await sync({ quiet: true });
    var recs = [];
    I.P.items.forEach(function (it) { var v = SU.cleanForSave(it); v.cby = '가져오기'; v.imp = I.tab; recs.push({ k: 'i:' + it.id, v: v }); });
    /* 이 품목들의 기존 입력 중 시트에 없는 날은 지움(다시 가져올 때 시트와 같게) */
    var want = {}; I.P.ents.forEach(function (e) { want[e.k] = 1; recs.push(e); });
    var ids = {}; I.P.items.forEach(function (it) { ids[it.id] = 1; });
    var dset = {}; I.P.dates.forEach(function (d) { dset[d] = 1; });
    store.ent.forEach(function (v, k) { var a = k.split('|'); if (ids[a[0]] && dset[a[2]] && !want['e:' + k]) recs.push({ k: 'e:' + k, v: null }); });
    for (var i = 0; i < recs.length; i += 2500) {
      msg.textContent = '저장 중… ' + Math.min(recs.length, i + 2500).toLocaleString() + ' / ' + recs.length.toLocaleString();
      await api({ action: 'suPush', recs: recs.slice(i, i + 2500), force: true }, 300000);
    }
    /* ERP 반영 시작일 = 시트 마지막 출고 다음 날 (시트 출고와 ERP 출고가 겹치지 않게) */
    var lastOut = '';
    I.P.items.forEach(function (it) { it.procs.forEach(function (pr) { if (SU.isOut(pr.n)) pr._ents.forEach(function (e) { if (e[0] > lastOut) lastOut = e[0]; }); }); });
    if (lastOut) { var nf = SU.addDays(lastOut, 1), cf = store.erpCfg && store.erpCfg.from; if (!cf || nf > cf) { setRec('c:erp', { from: nf }); toast('ERP 출고 반영 시작일을 ' + nf + ' 로 맞춤 (시트 마지막 출고 ' + lastOut + ')'); } }
    msg.textContent = '받는 중…';
    await sync();
    msg.textContent = '완료 — 품목 ' + I.P.items.length.toLocaleString() + ' · 입력 ' + I.P.ents.length.toLocaleString();
    toast('가져오기 완료: ' + I.src.name);
    renderTabs();
  } catch (e) { msg.innerHTML = '<span class="neg">' + esc(e.message) + '</span> — 같은 버튼을 다시 누르면 이어서(덮어쓰기라 안전)'; btn.disabled = false; }
}

/* ───────── 시작 ───────── */
async function appStart() {
  if (dataStarted) return;
  dataStarted = true;
  renderShell();
  loadPending();
  var had = await loadCache();
  await loadErpCache();
  S.pending.forEach(function (p) { store.set(p.k, p.v, { by: me() }); });
  if (had) render(); else $('#view').innerHTML = '<div class="empty">처음 받는 중… (자료가 많으면 30초쯤 걸릴 수 있음)</div>';
  await sync({ quiet: !had });
  await erpPull();
  render();
  setInterval(function () { if (document.visibilityState === 'visible') erpPull(); }, 60000);
  setInterval(function () { if (document.visibilityState === 'visible' && !S.sync.busy) sync({ quiet: true }); }, 20000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') sync({ quiet: true }); });
  addEventListener('beforeunload', function (e) { if (S.pending.size) { e.preventDefault(); e.returnValue = ''; } });
}
document.getElementById('syncBtn').onclick = function () { sync(); };
document.getElementById('verTag').textContent = SUB_VER;
auBoot();

   GitHub 주소로 연 창은 20초 뒤 한 번, 그다음 5분마다, 그리고 창으로 돌아올 때 새 버전이 있는지 확인함.

    +'<div style="display:flex;gap:8px;margin-top:18px">'
    +'<button type="button" data-k="later" style="flex:1;font:inherit;font-size:13px;font-weight:700;border:1px solid #cbd5e1;border-radius:9px;padding:9px 0;background:#fff;color:#475569;cursor:pointer">나중에</button>'
    +'<button type="button" data-k="go" style="flex:1;font:inherit;font-size:13px;font-weight:800;border:0;border-radius:9px;padding:9px 0;background:#17243b;color:#fff;cursor:pointer">새로고침</button>'
    +'</div></div>';
  b.querySelector('[data-k="go"]').onclick=function(){ location.reload(); };
  b.querySelector('[data-k="later"]').onclick=function(){ b.style.display='none'; };
}
window.suShowNewVerPop=pop;
var RE=/<meta name="su-ver" content="([^"]+)"/;
function headVer(){
  return fetch(location.origin+location.pathname+'?_v='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)return '';
    if(!r.body||!r.body.getReader)return r.text().then(function(t){var m=t.match(RE);return m?m[1]:'';});
    var rd=r.body.getReader(), dec=new TextDecoder(), txt='';
    function step(){ return rd.read().then(function(x){
      if(x.value)txt+=dec.decode(x.value,{stream:true});
      var m=txt.match(RE); if(m||x.done||txt.length>20000){ try{rd.cancel();}catch(_e){} return m?m[1]:''; }
      return step(); }); }
    return step();
  });
}
window.suCheckNewVer=function(){ return headVer(); };
function check(){
  if(!onPages()||busy)return; busy=true;
  headVer().then(function(there){
    if(!there||bn(there)<=bn(HERE)||shownFor===there)return;
    shownFor=there; pop(there);
  }).catch(function(){}).then(function(){ busy=false; });
}
if(onPages()){
  setTimeout(check,20000);
  setInterval(check,5*60*1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible')setTimeout(check,1500); });
}
})();
</script>

</body>
</html>
